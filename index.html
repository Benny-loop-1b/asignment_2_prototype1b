<header>

  <nav>

<main>

<section class="intro">
  <h2>Circular Loop</h2>
  <p>
    This version visualises an eight-beat loop as a circle so repetition can
    be understood through movement.
  </p>
</section>

<section>
  <div class="prototype-stage">
    <div class="controls">
      <button id="recordBtn">Record Sample</button>
      <button id="stopRecordBtn" class="secondary">Stop Recording</button>
      <button id="startBtn">Start Circle</button>
      <button id="stopBtn" class="secondary">Stop</button>
    </div>

    <div id="circle" class="circle-loop"></div>

    <div id="status" class="status">
      Record a sample, then start the circular loop.
    </div>
  </div>
</section>

</main>

<footer>Loop Together · Parallel Prototype</footer>

<script src="script.js"></script>
