<html lang="en">

<body>
<header>
<h1>Prototype 1A — Button Loop</h1>
<p>Simple media-style loop controls</p>
</header>
<main>
<a class="button secondary" href="../index.html">← Back</a>

<div class="panel">
<h2>Record and Repeat</h2>
<p>This version uses familiar controls so a beginner can record a short sound and hear it repeat.</p>
<div class="controls">
<button id="record">Record</button>
<button id="stopRec" class="secondary">Stop Recording</button>
<button id="play">Play Loop</button>
<button id="stopLoop" class="secondary">Stop Loop</button>
</div>
<div id="status" class="status">Ready.</div>
</div>

</main>
<footer>Loop Together · Parallel Prototype</footer>
<script src="script.js"></script>
</body>
