<body>
<header>
  <h1>Prototype 1A</h1>
  <p>Button Loop</p>
  <nav>
    <a href="../assignment2.html">← Back to Assignment 2</a>
  </nav>

<main>

<section class="intro">
  <h2>Button Loop</h2>
  <p>
    This prototype explores familiar media controls as a simple way to record
    and repeat a sound.
  </p>
</section>

<section>
  <div class="prototype-stage">
    <h2>Record a Short Sound</h2>

    <div class="controls">
      <button id="recordBtn">Record</button>
      <button id="stopRecordBtn" class="secondary">Stop Recording</button>
      <button id="playBtn">Play Loop</button>
      <button id="stopBtn" class="secondary">Stop Loop</button>
    </div>

    <div id="status" class="status">
      Ready. Allow microphone access when asked.
    </div>
  </div>
</section>

</main>

<footer>Loop Together · Parallel Prototype</footer>

<script src="script.js"></script>
</body>
