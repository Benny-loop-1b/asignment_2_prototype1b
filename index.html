<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype 2A</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Prototype 2A</h1>
    <p>Visual Feedback</p>
    <a href="../assignment2.html">← Back to Assignment 2</a>
  </header>

  <main>
    <section class="intro">
      <h2>See Your Sound</h2>
      <p>Start the microphone, then speak or clap to move the bar and circle.</p>
    </section>

    <section class="prototype-stage">
      <div class="controls">
        <button id="startBtn" type="button">Start Microphone</button>
        <button id="stopBtn" type="button" class="secondary">Stop</button>
      </div>

      <div class="meter">
        <div id="bar" class="meter-fill"></div>
      </div>

      <div id="pulse" class="pulse"></div>

      <div id="status" class="status" role="status">
        Microphone is off.
      </div>
    </section>
  </main>

  <footer>Loop Together · Parallel Prototype</footer>
</body>
</html>
